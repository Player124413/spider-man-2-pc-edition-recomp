# ВРЕМЕННО: вытащить настоящие Movies/*.bik из LFS через сеть GitHub Actions (в песочнице CDN недоступен).
# Ролики кладутся в отдельную ветку temp/coolgame-movies, оттуда забираются в references/ (gitignored),
# после чего ветка и этот workflow удаляются. В PR игровые файлы не попадают.
name: Fetch coolgame LFS movies (temp)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-lfs-movies-temp.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Клон только Movies с LFS
        run: |
          set -euo pipefail
          git lfs version || { sudo apt-get update -qq && sudo apt-get install -y git-lfs; }
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/Player124413/coolgame.git coolgame
          cd coolgame
          git sparse-checkout init --cone
          git sparse-checkout set Movies
          git checkout
          git lfs install --local
          git lfs pull --include='Movies/*.bik' --exclude=''
          n=0
          for f in Movies/*.bik; do
            magic=$(head -c 3 "$f")
            [ "$magic" = BIK ] || { echo "::error::$f — не BIK, а $(wc -c < "$f") байт ($magic)"; exit 1; }
            [ "$(wc -c < "$f")" -gt 4096 ] || { echo "::error::$f слишком маленький"; exit 1; }
            n=$((n+1))
          done
          echo "Загружено BIK: $n"
          du -sh Movies
          mkdir -p ../movies
          cp Movies/*.bik ../movies/

      - name: Отправить ролики во временную ветку
        run: |
          set -euo pipefail
          git checkout --orphan temp/coolgame-movies
          git rm -rf --cached . >/dev/null
          git add -f movies/*.bik
          git -c user.name='Arena agent' -c user.email='agent@arena.ai' commit -q -m 'temp: настоящие Movies/*.bik из coolgame LFS'
          git push --force origin temp/coolgame-movies
