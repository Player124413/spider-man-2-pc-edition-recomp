# ВРЕМЕННО: вытащить настоящие Movies/*.bik из LFS через сеть GitHub Actions (в песочнице CDN недоступен).
# Артефакт скачивается в references/coolgame/Movies, после чего workflow удаляется из ветки.
name: Fetch coolgame LFS movies (temp)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-lfs-movies-temp.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Клон только Movies с LFS
        run: |
          set -euo pipefail
          git lfs version || { sudo apt-get update -qq && sudo apt-get install -y git-lfs; }
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/Player124413/coolgame.git coolgame
          cd coolgame
          git sparse-checkout init --cone
          git sparse-checkout set Movies
          git checkout
          git lfs install --local
          git lfs pull --include='Movies/*.bik' --exclude=''
          n=0
          for f in Movies/*.bik; do
            magic=$(head -c 3 "$f")
            [ "$magic" = BIK ] || { echo "::error::$f — не BIK, а $(wc -c < "$f") байт ($magic)"; exit 1; }
            [ "$(wc -c < "$f")" -gt 4096 ] || { echo "::error::$f слишком маленький"; exit 1; }
            n=$((n+1))
          done
          echo "Загружено BIK: $n"
          du -sh Movies

      - name: Артефакт с роликами
        uses: actions/upload-artifact@v4
        with:
          name: coolgame-movies
          path: coolgame/Movies/*.bik
          retention-days: 1
          compression-level: 0
