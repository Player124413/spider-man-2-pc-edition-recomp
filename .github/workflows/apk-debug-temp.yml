name: APK debug temp
on:
  push:
    paths:
      - '.github/workflows/apk-debug-temp.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Just push a marker
        run: |
          echo marker > marker.txt
          git add -f marker.txt
          git -c user.name='Arena agent' -c user.email='agent@arena.ai' commit -q -m 'temp marker'
          git push -q --force origin HEAD:refs/heads/temp/apk-debug
