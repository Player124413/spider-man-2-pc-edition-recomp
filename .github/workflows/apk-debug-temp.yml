name: APK debug temp
on:
  push:
    paths:
      - '.github/workflows/apk-debug-temp.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diag
          set +e
          gh api repos/Player124413/spider-man-2-pc-edition-recomp/actions/artifacts/15003863143/zip -o diag/artifact.zip > diag/out.txt 2> diag/err.txt
          echo "rc=$?" >> diag/out.txt
          set -e
          ls -l diag >> diag/out.txt 2>&1 || true
          head -c 2000 diag/err.txt >> diag/out.txt 2>&1 || true
          cd diag
          git init -q
          git config user.name 'Arena agent'
          git config user.email 'agent@arena.ai'
          git add out.txt artifact.zip
          git commit -q -m 'temp apk diag'
          git push -q --force origin HEAD:refs/heads/temp/apk-debug
