name: APK debug temp
on:
  push:
    paths:
      - '.github/workflows/apk-debug-temp.yml'
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/Player124413/spider-man-2-pc-edition-recomp/actions/artifacts/15003863143/zip > artifact.zip
          ls -l artifact.zip
          unzip -o artifact.zip -d apk
          ls -l apk
          git checkout --orphan temp/apk-debug2
          git rm -rf --cached . >/dev/null
          git add -f apk
          git -c user.name='Arena agent' -c user.email='agent@arena.ai' commit -q -m 'temp apk'
          git push -q --force origin temp/apk-debug2
