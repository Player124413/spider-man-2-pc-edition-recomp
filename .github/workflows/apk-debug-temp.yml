name: APK debug temp
on:
  push:
    paths:
      - '.github/workflows/apk-debug-temp.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/Player124413/spider-man-2-pc-edition-recomp/actions/artifacts/15003863143/zip > artifact.zip
          ls -l artifact.zip
          unzip -o artifact.zip -d apk
      - name: Push APK to temp branch
        run: |
          set -euo pipefail
          ls -l apk
          sha256sum apk/*
          git checkout --orphan temp/apk-debug
          git rm -rf --cached . >/dev/null
          git add -f apk
          git -c user.name='Arena agent' -c user.email='agent@arena.ai' commit -q -m 'temp: apk for inspection'
          git push -q --force origin temp/apk-debug
