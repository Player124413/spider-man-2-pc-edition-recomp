// Android-проект webheadNX: лаунчер (Kotlin) + игра (libmain.so из корневого CMakeLists.txt, SDL2).
// Сборка — tools/build.sh android; вручную: gradle -p android assembleRelease. Один APK на eng и rus.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }  // зеркало Maven Central
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }  // зеркало Maven Central
    }
}
rootProject.name = "webheadNX"
include ':app'
